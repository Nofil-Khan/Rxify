<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80" fill="none">
  <defs>
    <linearGradient id="capGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="35%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="capWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="capGloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#pillShadow)">
    <g transform="rotate(-25 80 40)">
      <!-- Left Half: Emerald Green -->
      <path d="M 40 20 C 23 20 10 29 10 40 C 10 51 23 60 40 60 L 80 60 L 80 20 Z" fill="url(#capGreen)" />
      <!-- Right Half: Crisp White -->
      <path d="M 80 20 L 120 20 C 137 20 150 29 150 40 C 150 51 137 60 120 60 L 80 60 Z" fill="url(#capWhite)" />
      <!-- Middle Seam Ring -->
      <rect x="78" y="19" width="4" height="42" rx="2" fill="#064E3B" opacity="0.3" />
      <!-- Specular Highlight Strip -->
      <ellipse cx="80" cy="26" rx="55" ry="4" fill="url(#capGloss)" />
    </g>
  </g>
</svg>

