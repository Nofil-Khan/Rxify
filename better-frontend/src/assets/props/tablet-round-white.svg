<svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="tabletGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </radialGradient>
    <filter id="tabShadow" x="0" y="0" width="44" height="44" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#04120D" flood-opacity="0.25" />
    </filter>
  </defs>
  <g filter="url(#tabShadow)">
    <!-- Pill Base Circle -->
    <circle cx="22" cy="22" r="14" fill="url(#tabletGrad)" stroke="#E2E8F0" stroke-width="1" />
    <!-- Score Line in the middle -->
    <line x1="14" y1="22" x2="30" y2="22" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8" />
    <!-- Embossed Rim Highlight -->
    <circle cx="22" cy="22" r="12" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.8" />
  </g>
</svg>

