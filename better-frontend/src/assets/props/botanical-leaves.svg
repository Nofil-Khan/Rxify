<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" fill="none">
  <defs>
    <linearGradient id="leafGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#leafShadow)">
    <!-- Main curved stem -->
    <path d="M 20 480 Q 140 320 220 120 T 320 20" stroke="url(#stemGrad)" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Leaf 1 (Top) -->
    <path d="M 320 20 C 370 40 380 90 320 110 C 260 100 270 50 320 20 Z" fill="url(#leafGrad2)" opacity="0.9" />
    <!-- Leaf 2 (Right Upper) -->
    <path d="M 250 100 C 330 110 340 180 270 190 C 210 180 210 120 250 100 Z" fill="url(#leafGrad1)" opacity="0.95" />
    <!-- Leaf 3 (Left Upper) -->
    <path d="M 190 160 C 130 140 90 190 140 230 C 180 240 210 190 190 160 Z" fill="url(#leafGrad2)" opacity="0.88" />
    <!-- Leaf 4 (Right Middle) -->
    <path d="M 180 230 C 270 230 290 310 210 330 C 150 320 140 250 180 230 Z" fill="url(#leafGrad1)" />
    <!-- Leaf 5 (Left Middle) -->
    <path d="M 120 290 C 50 280 20 340 70 380 C 120 390 140 320 120 290 Z" fill="url(#leafGrad2)" opacity="0.9" />
    <!-- Leaf 6 (Right Lower) -->
    <path d="M 110 350 C 190 370 190 440 120 450 C 70 440 70 370 110 350 Z" fill="url(#leafGrad1)" />
  </g>
</svg>

