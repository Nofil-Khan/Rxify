<svg width="130" height="130" viewBox="-15 -15 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Luminous Radial Glow -->
    <radialGradient id="stockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#04120D" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Top Half -->
    <linearGradient id="capGreen3D" x1="42" y1="20" x2="78" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="25%" stop-color="#34D399" />
      <stop offset="65%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Pearl White Bottom Half -->
    <linearGradient id="capWhite3D" x1="42" y1="60" x2="78" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F8FAFC" />
      <stop offset="75%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Specular Highlight Strip -->
    <linearGradient id="specularGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2" />
    </linearGradient>

    <filter id="stockPillShadow" x="-20" y="-20" width="160" height="160" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#022C22" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Ambient Backlight -->
  <circle cx="60" cy="60" r="55" fill="url(#stockGlow)" />

  <!-- Tilted 3D Floating Capsule (-42 deg) -->
  <g filter="url(#stockPillShadow)" transform="rotate(-42 60 60)">
    <!-- Base Shadow Hull -->
    <rect x="42" y="20" width="36" height="80" rx="18" fill="#021E16" fill-opacity="0.4" />

    <!-- Emerald Top Half -->
    <path d="M42 38C42 28.0589 50.0589 20 60 20C69.9411 20 78 28.0589 78 38V60H42V38Z" fill="url(#capGreen3D)" />

    <!-- White / Pearl Bottom Half -->
    <path d="M42 60H78V82C78 91.9411 69.9411 100 60 100C50.0589 100 42 91.9411 42 82V60Z" fill="url(#capWhite3D)" />

    <!-- Center Seam Dividing Ring -->
    <rect x="41.5" y="58.75" width="37" height="2.5" rx="1.25" fill="#042F24" fill-opacity="0.5" />

    <!-- Left Primary Longitudinal Highlight Streak -->
    <path d="M48 26C48 23 52 22 58 22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
    <path d="M48 26V92" stroke="url(#specularGlow)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Right Subtle Rim Rimlight -->
    <path d="M72 32V86" stroke="#A7F3D0" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45" />
  </g>
</svg>
